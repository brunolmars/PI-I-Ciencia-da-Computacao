<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indicadores Econômicos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800">

  <!-- HEADER -->
  <header class="bg-white shadow-md">
    <div class="max-w-5xl mx-auto flex items-center justify-between p-4">

      <!-- Logo -->
      <h1 class="text-2xl font-bold">Indicadores</h1>

      <!-- Menu PC -->
      <nav class="hidden md:flex gap-6 text-lg">
        <a href="#" class="hover:text-blue-500 transition">Home</a>
        <a href="#" class="hover:text-blue-500 transition">Sobre</a>
        <a href="#" class="hover:text-blue-500 transition">Contato</a>
      </nav>

      <!-- Menu Mobile (hamburger) -->
      <div class="md:hidden">
        <div class="space-y-1">
          <div class="w-6 h-1 bg-black"></div>
          <div class="w-6 h-1 bg-black"></div>
          <div class="w-6 h-1 bg-black"></div>
        </div>
      </div>

    </div>
  </header>

  <!-- CONTENT -->
  <main class="max-w-5xl mx-auto p-4">

    <!-- Título -->
    <h2 class="text-xl md:text-2xl font-semibold mb-4">Selecione os indicadores:</h2>

    <!-- Caixas de seleção -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">

        <!-- IPCA -->
        <label class="flex items-center gap-3 p-4 rounded-xl bg-green-200 shadow">
            <input type="checkbox" class="w-5 h-5" />
            <span class="text-lg font-medium">IPCA</span>
        </label>
        
        <!-- Ibovespa -->
        <label class="flex items-center gap-3 p-4 rounded-xl bg-blue-200 shadow">
          <input type="checkbox" class="w-5 h-5" />
          <span class="text-lg font-medium">Ibovespa</span>
        </label>

      <!-- Selic EUA -->
      <label class="flex items-center gap-3 p-4 rounded-xl bg-red-200 shadow">
        <input type="checkbox" class="w-5 h-5" />
        <span class="text-lg font-medium">Selic EUA</span>
      </label>

      <!-- Juros Reais -->
      <label class="flex items-center gap-3 p-4 rounded-xl bg-yellow-200 shadow">
        <input type="checkbox" class="w-5 h-5" />
        <span class="text-lg font-medium">Juros Reais</span>
      </label>

    </div>

    <!-- Espaço para gráfico -->
    <div class="w-full h-72 md:h-96 bg-white rounded-xl shadow flex items-center justify-center text-gray-500 overflow-hidden">
  <img 
    src="grafico-volume-financeiro.png" alt="" class="max-h-full max-w-full object-contain">
    </div>

  </main>

</body>
</html>
